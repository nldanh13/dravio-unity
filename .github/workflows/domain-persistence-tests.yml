name: Domain & persistence tests

# Chạy test C# thuần của Dravio.Domain / Dravio.Persistence / Dravio.Platform ngoài Unity,
# và đối chiếu với engine TypeScript gốc (nldanh13/dravio @ b33ec7a3).
on:
  push:
    paths:
      - 'Assets/Dravio/Domain/**'
      - 'Assets/Dravio/Persistence/**'
      - 'Assets/Dravio/Platform/**'
      - 'Assets/Dravio/Tests/**'
      - '.github/workflows/domain-persistence-tests.yml'
  pull_request:
    paths:
      - 'Assets/Dravio/Domain/**'
      - 'Assets/Dravio/Persistence/**'
      - 'Assets/Dravio/Platform/**'
      - 'Assets/Dravio/Tests/**'
      - '.github/workflows/domain-persistence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Domain tests (U2.1)
        run: dotnet test "Assets/Dravio/Tests/Domain/DotNet~/Dravio.Domain.Tests.csproj"
      - name: Persistence & platform tests (U2.2)
        run: dotnet test "Assets/Dravio/Tests/Persistence/DotNet~/Dravio.Persistence.Tests.csproj"
      - name: SIGKILL test of the file save store
        if: runner.os == 'Linux'
        run: bash "Assets/Dravio/Tests/Persistence/Tools~/KillTest/kill-test.sh" 30

  typescript-parity:
    runs-on: ubuntu-latest
    env:
      TS_COMMIT: b33ec7a3dc98b4a74857fe92d143475028fc0d96
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout TypeScript reference
        run: |
          git init -q ts && cd ts
          git remote add origin https://github.com/nldanh13/dravio
          git fetch -q --depth 1 origin "$TS_COMMIT"
          git checkout -q FETCH_HEAD
          npm ci --no-audit --no-fund
      - name: Golden vectors regenerate byte-identical
        run: |
          cp "Assets/Dravio/Tests/Domain/Tools~/golden.test.ts" ts/tests/unit/zz-golden.test.ts
          cp "Assets/Dravio/Tests/Persistence/Tools~/persistence-golden.test.ts" ts/tests/unit/zz-persistence-golden.test.ts
          cp "Assets/Dravio/Tests/Domain/Tools~/world-golden.test.ts" ts/tests/unit/zz-world-golden.test.ts
          cp "Assets/Dravio/Tests/Domain/Tools~/progress-golden.test.ts" ts/tests/unit/zz-progress-golden.test.ts
          cp "Assets/Dravio/Tests/Domain/Tools~/genetics-golden.test.ts" ts/tests/unit/zz-genetics-golden.test.ts
          (cd ts && GOLDEN_OUT="$GITHUB_WORKSPACE/Assets/Dravio/Tests/Domain/Golden/ts-golden-b33ec7a.json" npx vitest run tests/unit/zz-golden.test.ts)
          (cd ts && GOLDEN_OUT="$GITHUB_WORKSPACE/Assets/Dravio/Tests/Domain/Golden/ts-world-golden-b33ec7a.json" npx vitest run tests/unit/zz-world-golden.test.ts)
          (cd ts && GOLDEN_OUT="$GITHUB_WORKSPACE/Assets/Dravio/Tests/Domain/Golden/ts-progress-golden-b33ec7a.json" npx vitest run tests/unit/zz-progress-golden.test.ts)
          (cd ts && GOLDEN_OUT="$GITHUB_WORKSPACE/Assets/Dravio/Tests/Domain/Golden/ts-genetics-golden-b33ec7a.json" npx vitest run tests/unit/zz-genetics-golden.test.ts)
          (cd ts && GOLDEN_OUT="$GITHUB_WORKSPACE/Assets/Dravio/Tests/Persistence/Golden/ts-persistence-golden-b33ec7a.json" npx vitest run tests/unit/zz-persistence-golden.test.ts)
          git diff --exit-code -- Assets/Dravio/Tests/Domain/Golden Assets/Dravio/Tests/Persistence/Golden
      - name: TypeScript reads saves written by C#
        run: |
          export DRAVIO_EXPORT_DIR="$RUNNER_TEMP/csharp-saves"
          dotnet test "Assets/Dravio/Tests/Persistence/DotNet~/Dravio.Persistence.Tests.csproj" --filter "FullyQualifiedName~CrossRuntimeExportTests|FullyQualifiedName~WorldSaveCompatTests|FullyQualifiedName~ProgressSaveTests|FullyQualifiedName~BreedingSaveTests"
          cp "Assets/Dravio/Tests/Persistence/Tools~/verify-csharp-saves.test.ts" ts/tests/unit/zz-verify-csharp-saves.test.ts
          (cd ts && npx vitest run tests/unit/zz-verify-csharp-saves.test.ts)
