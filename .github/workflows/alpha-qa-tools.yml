name: Alpha QA tools
on:
  push:
    paths: ['scripts/qa/**', '.github/workflows/alpha-qa-tools.yml']
  pull_request:
    paths: ['scripts/qa/**', '.github/workflows/alpha-qa-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s scripts/qa -p 'test_*.py'
